events {}

http {

  upstream auth_service { server auth-service:3000; }
  upstream user_service { server user-service:3001; }
  upstream lab_service { server lab-service:3002; }
  upstream reservation_service { server reservation-service:3003; }
  upstream approval_service { server approval-service:3004; }
  upstream availability_service { server availability-service:3005; }
  upstream notification_service { server notification-service:3006; }
  upstream audit_service { server audit-service:3007; }
  upstream report_service { server report-service:3008; }
  upstream backup_service { server backup-service:3009; }

  server {
    listen 80;

    location /auth/ {
      proxy_pass http://auth_service/;
    }

    location /users/ {
      proxy_pass http://user_service/;
    }

    location /labs/ {
      proxy_pass http://lab_service/;
    }

    location /reservations/ {
      proxy_pass http://reservation_service/;
    }

    location /approvals/ {
      proxy_pass http://approval_service/;
    }

    location /availability/ {
      proxy_pass http://availability_service/;
    }

    location /notifications/ {
      proxy_pass http://notification_service/;
    }

    location /audit/ {
      proxy_pass http://audit_service/;
    }

    location /reports/ {
      proxy_pass http://report_service/;
    }

    location /backup/ {
      proxy_pass http://backup_service/;
    }
  }
}
