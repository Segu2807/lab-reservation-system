# CI/CD Reservation Service - Versión corregida
name: CI/CD Reservation Service

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "services/reservation-service/**"

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'qa' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: services/reservation-service
        run: npm ci

      - name: Install TypeScript types
        working-directory: services/reservation-service
        run: |
          npm install --save-dev @types/cors @types/express @types/node @types/jest
          npm install --save-dev typescript jest ts-jest @types/supertest

      - name: Run unit tests (if any)
        working-directory: services/reservation-service
        run: |
          if [ -f "package.json" ] && npm run test --silent 2>/dev/null; then
            npm test
          else
            echo "No test script found or tests disabled"
          fi

      # k6 load testing (opcional)
      - name: Install k6
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run load test (opcional)
        if: ${{ github.ref == 'refs/heads/main' }}
        working-directory: services/reservation-service
        run: |
          if [ -f "tests/load/load-test.js" ]; then
            k6 run tests/load/load-test.js
          else
            echo "No load tests found"
          fi

      # DOCKER
      - name: Build Docker image
        working-directory: services/reservation-service
        run: docker build -t ${{ secrets.DOCKER_USER }}/reservation-service:${{ github.sha }} .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USER }}/reservation-service:${{ github.sha }}

      # DEPLOY (solo en main)
      - name: Deploy to EC2
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USER }}/reservation-service:${{ github.sha }}
            docker stop reservation-service || true
            docker rm reservation-service || true
            docker run -d --name reservation-service \
              -p 3000:3000 \
              ${{ secrets.DOCKER_USER }}/reservation-service:${{ github.sha }}
