name: CI/CD Reservation Service

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "services/reservation-service/**"

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'qa' }}s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: services/reservation-service
        run: npm install

      - name: Run unit tests
        working-directory: services/reservation-service
        run: npm run test

      # k6
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run load test
        working-directory: services/reservation-service
        run: k6 run tests/load/load-test.js

      # DOCKER
      - name: Build Docker image
        working-directory: services/reservation-service
        run: docker build -t ${{ secrets.DOCKER_USER }}/reservation-service:latest .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USER }}/reservation-service:latest

      # DEPLOY
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USER }}/reservation-service:latest
            docker stop reservation-service || true
            docker rm reservation-service || true
            docker run -d --name reservation-service \
              -p 3000:3000 \
              ${{ secrets.DOCKER_USER }}/reservation-service:latest
