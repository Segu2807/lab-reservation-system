name: CI/CD User Service

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "services/user-service/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # environment:  # <-- COMENTA ESTA LÍNEA TEMPORALMENTE para debugging
    #   name: ${{ github.ref == 'refs/heads/main' && 'production' || 'qa' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/user-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/user-service:${{ github.sha }}
            ${{ secrets.DOCKER_USER }}/user-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
