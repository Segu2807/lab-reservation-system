name: CI/CD Report Service

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "services/report-service/**"

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # Usa 20 en lugar de 18 para consistencia

      - name: Install dependencies
        working-directory: services/report-service
        run: |
          npm ci  # Usa ci en lugar de install para consistencia
          # O si no tienes package-lock.json:
          # npm install
        
      - name: Run tests
        working-directory: services/report-service
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/report-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/report-service:${{ github.sha }}
            ${{ secrets.DOCKER_USER }}/report-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
