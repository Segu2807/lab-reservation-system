name: CI/CD Audit Service

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "services/audit-service/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: services/audit-service/package-lock.json

      - name: Install dependencies (para generar lockfile si falta)
        working-directory: services/audit-service
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Generando package-lock.json..."
            npm install
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/audit-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/audit-service:${{ github.sha }}
            ${{ secrets.DOCKER_USER }}/audit-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max