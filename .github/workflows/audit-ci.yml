name: CI/CD Audit Service

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "services/audit-service/**"

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'qa' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20  # Cambié de 18 a 20 para coincidir con tu Dockerfile

      - name: Install dependencies
        working-directory: services/audit-service
        run: npm ci  # Cambié de npm install a npm ci (más confiable para CI/CD)

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build and push Docker image
        working-directory: services/audit-service
        env:
          DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_USER }}/audit-service
          GIT_SHA: ${{ github.sha }}
        run: |
          docker build -t $DOCKER_IMAGE_NAME:$GIT_SHA -t $DOCKER_IMAGE_NAME:latest .
          docker push $DOCKER_IMAGE_NAME:$GIT_SHA
          docker push $DOCKER_IMAGE_NAME:latest