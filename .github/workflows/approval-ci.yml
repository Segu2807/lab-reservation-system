name: CI/CD Approval Service

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "services/approval-service/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: services/approval-service
        run: |
          # Instala dependencias localmente para verificar
          npm install
          # Compila para verificar
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/approval-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/approval-service:${{ github.sha }}
            ${{ secrets.DOCKER_USER }}/approval-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
