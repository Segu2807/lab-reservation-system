global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'microservices'
    static_configs:
      - targets:
        - auth-service:3000
        - user-service:3000
        - lab-service:3000
        - reservation-service:3000
        - notification-service:3000
        - report-service:3000
        - approval-service:3000
        - availability-service:3000
        - audit-service:3000