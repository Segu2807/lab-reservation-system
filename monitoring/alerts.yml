groups:
- name: microservices-alerts
  rules:
  - alert: ServiceDown
    expr: up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: Servicio caído
      description: El servicio {{ $labels.instance }} no responde

  - alert: High5xxErrors
    expr: rate(http_requests_total{status=~"5.."}[1m]) > 0.1
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: Errores HTTP elevados
      description: Se detectó una tasa alta de errores 5xx

